# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms@0.221.0/schema/sveltia-cms.json
# Painel de conteúdo (Sveltia CMS), em /admin/.
#
# - No site publicado: login com GitHub pelo OAuth do Netlify (base_url padrão
#   do Sveltia). Posts passam pelo Editorial Workflow: cada um vira um branch
#   com PR, e o deploy preview do Netlify mostra os rascunhos (BLOG_DRAFTS=1,
#   netlify.toml). Publicar é o merge. O resto salva direto na main. Todo
#   deploy passa pelo `npm run verify`.
# - No `npm run dev`: abra http://localhost:3000/admin/index.html num navegador
#   Chromium e escolha "Work with Local Repository". Ele grava direto nos
#   arquivos; o commit continua sendo seu.
#
# Os esquemas do Astro (src/content.config.js) são o contrato: o que o painel
# gravar de errado derruba o build. Fora do painel só fica o
# src/data/resume.json, que ele regravaria só com os campos que conhece.
#
# Imagens em src/assets/<coleção>/<entrada>/, caminho relativo à entrada, que é
# o que o image() do Astro espera. O preview usa public/admin/preview.css.

backend:
  name: github
  repo: thomasgroch/my-site
  branch: main
  commit_messages:
    create: 'content({{collection}}): cria {{slug}}'
    update: 'content({{collection}}): atualiza {{slug}}'
    delete: 'content({{collection}}): remove {{slug}}'
    uploadMedia: 'content: envia {{path}}'
    deleteMedia: 'content: remove {{path}}'

app_title: thomasdev.xyz
site_url: https://thomasdev.xyz
logo:
  src: /favicon.svg

media_folder: /src/assets
public_folder: /src/assets

# Nomes de arquivo como o site já usa: minúsculas, sem acento.
slug:
  encoding: ascii
  clean_accents: true

# Textos do site: pt e en lado a lado, um arquivo por idioma.
i18n:
  structure: multiple_files
  locales: [pt, en]
  default_locale: pt

output:
  # Campo vazio fica como '': os esquemas tratam '' como ausente, e os textos
  # do site precisam da chave, mesmo vazia (o tradutor devolve o nome da chave
  # quando ela falta).
  omit_empty_optional_fields: false
  # Os YAML existentes têm todas as strings entre aspas duplas.
  yaml:
    quote: double

collections:
  - name: blog
    label: Blog
    label_singular: Post
    icon: article
    description: >-
      Only in English. Each post in progress gets a branch, a pull request and a
      Netlify deploy preview that shows drafts. Publishing merges it. `draft: true`
      keeps a merged post out of production.
    publish_mode: editorial_workflow
    folder: src/content/blog
    extension: mdx
    format: frontmatter
    identifier_field: title
    slug:
      template: '{{title}}'
      editable: [create]
    summary: "{{draft | ternary('📝 ', '')}}{{title}}"
    sortable_fields:
      fields: [pubDate, title]
      default: { field: pubDate, direction: descending }
    view_filters:
      - { label: Drafts, field: draft, pattern: true }
      - { label: Published, field: draft, pattern: false }
    view_groups:
      groups:
        - { name: series, label: Series, field: series }
        - { name: status, label: Draft, field: draft }
    thumbnail: cover
    preview_path: blog/{{slug}}
    media_folder: ../../assets/blog/{{filename}}
    public_folder: ../../assets/blog/{{filename}}
    fields:
      - { name: title, label: Title, widget: string }
      - { name: description, label: Description, widget: text }
      - { name: pubDate, label: Published, widget: datetime, type: date, format: YYYY-MM-DD, default: '{{now}}' }
      - { name: updatedDate, label: Updated, widget: datetime, type: date, format: YYYY-MM-DD, required: false }
      - { name: draft, label: Draft, widget: boolean, default: true, hint: Drafts show up in dev and stay out of the production build. }
      - { name: tags, label: Tags, widget: list, field: { name: tag, label: Tag, widget: string }, required: false }
      - { name: series, label: Series, widget: string, required: false, hint: Posts with the same series name link to each other. }
      - { name: seriesPart, label: Part, widget: number, value_type: int, min: 1, required: false, hint: 'Position in the series, starting at 1.' }
      - { name: cover, label: Cover, widget: image, required: false }
      - { name: coverAlt, label: Cover alt text, widget: string, required: false }
      # Só o modo raw: o rich text reescreveria o MDX (imports e componentes).
      - name: body
        label: Content
        widget: richtext
        modes: [raw]
        hint: >-
          MDX. Components available in every post:
          `<Callout type="note|tip|warning|danger">…</Callout>`,
          `<Wide>…</Wide>` and
          `<Embed src="https://…" title="What it shows" caption="…" wide />`.

  - divider: true
    name: portfolio

  - name: projects
    label: Projetos
    label_singular: Projeto
    icon: work
    folder: src/content/projects
    extension: yaml
    format: yaml
    identifier_field: company
    slug: '{{company}}'
    summary: '{{startDate}} · {{company}}'
    sortable_fields:
      fields: [startDate, company, order]
      default: { field: startDate, direction: descending }
    thumbnail: image
    media_folder: ../../assets/projects/{{filename}}
    public_folder: ../../assets/projects/{{filename}}
    fields:
      - { name: company, label: Empresa, widget: string }
      - name: position
        label: Cargo
        widget: object
        fields:
          - { name: pt, label: Português, widget: string }
          - { name: en, label: English, widget: string }
      # O valor é o índice das chaves general.project.type_N.
      - name: type
        label: Tipo
        widget: select
        default: '1'
        options:
          - { label: Acadêmico, value: '0' }
          - { label: Profissional, value: '1' }
          - { label: Freelancer, value: '2' }
          - { label: Pessoal, value: '3' }
      - { name: startDate, label: Ano de início, widget: string, pattern: ['^\d{4}$', 'Use só o ano, com quatro dígitos'] }
      - { name: website, label: Site, widget: string, type: url, required: false }
      - { name: image, label: Imagem, widget: image, required: false }
      - name: summary
        label: Resumo
        widget: object
        fields:
          - { name: pt, label: Português, widget: text }
          - { name: en, label: English, widget: text }
      - { name: order, label: Ordem, widget: number, value_type: int, default: 0, required: false, hint: 'Desempate entre projetos do mesmo ano: menor aparece antes.' }

  - name: stack
    label: Stack
    icon: layers
    folder: src/content/stack
    extension: yaml
    format: yaml
    identifier_field: name
    slug: '{{name}}'
    summary: '{{name}}'
    sortable_fields:
      fields: [name, group, order]
      default: { field: order }
    view_groups:
      groups:
        - { name: group, label: Grupo, field: group }
      default: group
    thumbnail: logo
    media_folder: ../../assets/stack/{{filename}}
    public_folder: ../../assets/stack/{{filename}}
    fields:
      - { name: name, label: Nome, widget: string }
      - { name: group, label: Grupo, widget: select, default: misc, options: [back, front, database, infra, misc, history] }
      - { name: href, label: Link, widget: string, type: url }
      - { name: logo, label: Logo, widget: image }
      - { name: order, label: Ordem, widget: number, value_type: int, default: 0, required: false }

  - divider: true
    name: site

  - name: texts
    label: Textos do site
    icon: translate
    description: Interface texts and bio from src/locales, Portuguese and English side by side. New keys go in the JSON files and here.
    format: json
    i18n: true
    files:
      - name: general
        label: Geral
        file: src/locales/general.{{locale}}.json
        i18n: true
        fields:
          - { name: site_name, widget: string, i18n: true }
          - { name: meta_description_home, widget: string, i18n: true }
          - { name: meta_description_stack, widget: string, i18n: true }
          - { name: meta_description_projects, widget: text, i18n: true }
          - { name: meta_description_contact, widget: string, i18n: true }
          - { name: meta_title, widget: string, i18n: true }
          - { name: meta_intro, widget: text, i18n: true }
          - { name: meta_description_meta, widget: text, i18n: true }
          - { name: skip_to_content, widget: string, i18n: true }
          - { name: theme_toggle, widget: string, i18n: true }
          - { name: language, widget: string, i18n: true }
          - { name: nav_about, widget: string, i18n: true }
          - { name: nav_stack, widget: string, i18n: true }
          - { name: nav_projects, widget: string, i18n: true }
          - { name: nav_contact, widget: string, i18n: true }
          - { name: nav_blog, widget: string, i18n: true }
          - { name: nav_open_menu, widget: string, i18n: true }
          - { name: role_profile, widget: string, i18n: true }
          - { name: profile_description, widget: text, i18n: true }
          - { name: stack_intro, widget: text, i18n: true }
          - { name: stack_back, widget: string, i18n: true }
          - { name: stack_front, widget: string, i18n: true }
          - { name: stack_db, widget: string, i18n: true }
          - { name: stack_infra, widget: string, i18n: true }
          - { name: stack_misc, widget: string, i18n: true }
          - { name: stack_history, widget: string, i18n: true }
          - { name: stack_desc_back, widget: string, i18n: true, required: false }
          - { name: stack_desc_front, widget: text, i18n: true }
          - { name: stack_desc_db, widget: string, i18n: true, required: false }
          - { name: stack_desc_infra, widget: text, i18n: true }
          - { name: stack_desc_misc, widget: text, i18n: true }
          - { name: stack_note, widget: text, i18n: true }
          - { name: stack_history_description, widget: text, i18n: true }
          - name: project
            widget: object
            i18n: true
            fields:
              - { name: type_0, widget: string, i18n: true }
              - { name: type_1, widget: string, i18n: true }
              - { name: type_2, widget: string, i18n: true }
              - { name: type_3, widget: string, i18n: true }
          - { name: nothing_here, widget: string, i18n: true }
          - { name: goto_site, widget: string, i18n: true }
          - { name: footer_build_with_node, widget: string, i18n: true }
          - { name: footer_source, widget: string, i18n: true }
      - name: contact
        label: Formulário de contato
        file: src/locales/contact.{{locale}}.json
        i18n: true
        fields:
          - { name: name, widget: string, i18n: true }
          - { name: email, widget: string, i18n: true }
          - { name: telephone, widget: string, i18n: true }
          - { name: city, widget: string, i18n: true }
          - { name: help, widget: string, i18n: true }
          - { name: optional, widget: string, i18n: true }
          - { name: span_message, widget: text, i18n: true }
          - { name: submit, widget: string, i18n: true }
          - { name: sending, widget: string, i18n: true }

singletons:
  - name: meta
    label: Colofão (/meta)
    icon: info
    file: src/content/meta.yaml
    format: yaml
    fields:
      - name: groups
        label: Grupos
        label_singular: Grupo
        widget: list
        root: true
        hint: Aparecem nesta ordem.
        summary: '{{title.pt}}'
        fields:
          - name: title
            label: Título
            widget: object
            fields:
              - { name: pt, label: Português, widget: string }
              - { name: en, label: English, widget: string }
          - name: intro
            label: Introdução
            widget: object
            fields:
              - { name: pt, label: Português, widget: text }
              - { name: en, label: English, widget: text }
          - name: items
            label: Itens
            label_singular: Item
            widget: list
            summary: '{{name.pt}}'
            fields:
              - name: name
                label: Nome
                widget: object
                fields:
                  - { name: pt, label: Português, widget: string }
                  - { name: en, label: English, widget: string }
              - { name: pkg, label: Pacote npm, widget: string, required: false, hint: A versão é lida do package-lock.json no build. }
              - { name: version, label: Versão fixa, widget: string, required: false, hint: Só para o que não é pacote npm. }
              - { name: url, label: Link, widget: string, type: url }
              - name: note
                label: Nota
                widget: object
                fields:
                  - { name: pt, label: Português, widget: text }
                  - { name: en, label: English, widget: text }
