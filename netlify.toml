[build]
  publish = "dist/"
  # `verify` roda lint, build, testes, checagem de links e de CSS, e o
  # orçamento de peso. Qualquer um que falhe cancela a publicação, então o
  # deploy anterior continua no ar.
  command = "npm run verify"
  # Não gasta build quando o commit só mexe em documentação.
  ignore = "[ -n \"$CACHED_COMMIT_REF\" ] && git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- ':!docs' ':!*.md'"

[build.environment]
  # Astro 7 exige Node 22.12+.
  NODE_VERSION = "22"

# Deploy preview (PR, inclusive os que o painel abre para cada post): mostra
# os rascunhos, para revisar o post antes do merge. Produção continua sem eles.
[context.deploy-preview.environment]
  BLOG_DRAFTS = "1"

[functions]
  directory = "functions/"
  node_bundler = "esbuild"

[dev]
  command = "npm run dev:front"
  targetPort = 3000
  port = 8888
  autoLaunch = false

# netlify-plugin-cypress está instalado pela interface do Netlify e não pode
# ser removido pelo repositório. Sem este bloco ele voltaria ao padrão
# `enable = true` e rodaria os testes contra a produção depois de cada deploy,
# enviando e-mails de verdade pelo formulário. Mantenha até removê-lo no
# painel; depois disso, apague este bloco e defina CYPRESS_INSTALL_BINARY = "0"
# em [build.environment] para o build parar de baixar o binário do Cypress.
[[plugins]]
  package = "netlify-plugin-cypress"
  [plugins.inputs]
    enable = false

# A versão em japonês foi removida em 2026-09; links antigos vão para o inglês.
[[redirects]]
  from = "/jp"
  to = "/en"
  status = 301

[[redirects]]
  from = "/jp/*"
  to = "/en/:splat"
  status = 301

# Assets do Astro têm hash no nome: cache agressivo é seguro.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "interest-cohort=(), camera=(), microphone=(), geolocation=()"
